<section class="upload-card">

    <div class="upload-header">
        <h2>{{ i18n.translate('upload.title') }}</h2>

        <p>
            {{ i18n.translate('upload.description') }}
        </p>
    </div>

    <!-- File Upload -->
    <div class="upload-area">

        <label for="documentFiles" class="upload-label">
            <span class="upload-icon">+</span>

            <strong>{{ i18n.translate('upload.select') }}</strong>

            <small>
                {{ i18n.translate('upload.fileHint') }}
            </small>
        </label>

        <input id="documentFiles" type="file" accept="image/png,image/jpeg" multiple [disabled]="isLoading"
            [attr.aria-label]="i18n.translate('upload.select')"
            (change)="onFilesSelected($event)" />

    </div>

    <!-- Image Previews -->
    <div class="preview-grid" *ngIf="previews.length > 0">

        <div class="preview-item" *ngFor="let preview of previews">

            <img *ngIf="preview.url" [src]="preview.url" [alt]="preview.name" />

            <span class="filename">
                {{ preview.name }}
            </span>

        </div>

    </div>

    <!-- Actions -->
    <div class="upload-actions">

        <div class="language-field">

            <label for="language">
                {{ i18n.translate('language.explanation') }}
            </label>

            <select id="language" [value]="language" [disabled]="isLoading" (change)="onLanguageChange($event)">
                <option value="en">{{ i18n.translate('language.english') }}</option>
                <option value="ja">{{ i18n.translate('language.japanese') }}</option>
                <option value="vi">{{ i18n.translate('language.vietnamese') }}</option>
            </select>

        </div>

        <button type="button" (click)="analyze()" [disabled]="!selectedFiles.length || isLoading">
            {{ i18n.translate(isLoading ? 'upload.analyzing' : 'upload.analyze') }}
        </button>

        <button type="button" (click)="clearFiles()" [disabled]="!selectedFiles.length || isLoading">
            {{ i18n.translate('upload.clear') }}
        </button>

    </div>

    <!-- Loading -->
    <p class="loading" *ngIf="isLoading">
        {{ i18n.translate('upload.loading') }}
    </p>

    <!-- Error -->
    <p class="error" *ngIf="errorMessage">
        {{ errorMessage }}
    </p>

</section>
